name: Boost 1.53 Windows build probe
on:
  push:
    paths: ['.github/workflows/boost153-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download official Boost source
        shell: pwsh
        run: |
          Invoke-WebRequest https://archives.boost.io/release/1.53.0/source/boost_1_53_0.tar.bz2 -OutFile boost.tar.bz2
          $hash = (Get-FileHash boost.tar.bz2 -Algorithm SHA256).Hash.ToLower()
          Write-Output "Source SHA256: $hash"
          if ($hash -ne 'f88a041b01882b0c9c5c05b39603ec8383fb881f772f6f9e6e6fd0e0cddb9196') { throw 'Source hash mismatch' }
          7z x boost.tar.bz2 -y | Out-Null
          7z x boost.tar -y | Out-Null
      - name: Probe original build with native MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ver
          cl 2>&1
          cd boost_1_53_0
          call bootstrap.bat
          type bootstrap.log
          if not exist b2.exe exit /b 1
          b2.exe --version
          b2.exe toolset=msvc address-model=64 variant=release link=static,shared threading=multi --without-python --without-mpi -j2 stage > build.log 2>&1
          set RESULT=%ERRORLEVEL%
          type build.log
          dir /s /b stage\lib
          exit /b %RESULT%
