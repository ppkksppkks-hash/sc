name: Boost 1.53 Windows build probe
on:
  push:
    paths: ['.github/workflows/boost153-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download official Boost source
        shell: pwsh
        run: |
          Invoke-WebRequest https://archives.boost.io/release/1.53.0/source/boost_1_53_0.zip -OutFile boost.zip
          $hash = (Get-FileHash boost.zip -Algorithm SHA256).Hash.ToLower()
          Write-Output "Source SHA256: $hash"
          if ($hash -ne 'f9062177b2d0e0fe2d39883ebd32106ebeb72a8df71d789048108bf3049d76c0') { throw 'Source hash mismatch' }
          7z x boost.zip -y | Out-Null
      - name: Probe original build with native MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          ver
          cl 2>&1
          cd boost_1_53_0
          call bootstrap.bat vc11
          type bootstrap.log
          if not exist b2.exe exit /b 1
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          b2.exe --version
          b2.exe toolset=msvc address-model=64 variant=release link=static,shared threading=multi --without-python --without-mpi -j2 stage > build.log 2>&1
          set RESULT=%ERRORLEVEL%
          type build.log
          dir /s /b stage\lib
          exit /b %RESULT%
