name: Boost 1.53 Windows build probe
on:
  push:
    paths: ['.github/workflows/boost153-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download official Boost source
        shell: pwsh
        run: |
          Invoke-WebRequest https://archives.boost.io/release/1.53.0/source/boost_1_53_0.zip -OutFile boost.zip
          $hash = (Get-FileHash boost.zip -Algorithm SHA256).Hash.ToLower()
          Write-Output "Source SHA256: $hash"
          if ($hash -ne 'f9062177b2d0e0fe2d39883ebd32106ebeb72a8df71d789048108bf3049d76c0') { throw 'Source hash mismatch' }
          7z x boost.zip -y | Out-Null
      - name: Write independent smoke test
        shell: pwsh
        run: |
          @'
          #include <boost/version.hpp>
          #include <boost/filesystem.hpp>
          #include <boost/regex.hpp>
          #include <boost/asio.hpp>
          #include <iostream>
          int main() {
              boost::asio::io_service io;
              boost::asio::ip::tcp::socket s(io);
              if (BOOST_VERSION != 105300 || !boost::filesystem::exists(".") || !boost::regex_match(std::string("boost153"), boost::regex("boost[0-9]+"))) return 1;
              std::cout << BOOST_LIB_VERSION << " filesystem+regex+asio smoke OK\n";
          }
          '@ | Set-Content -Encoding ascii smoke.cpp
      - name: Build selected libraries and run native smoke tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          ver
          cl 2>&1
          cd boost_1_53_0
          call bootstrap.bat vc11
          type bootstrap.log
          if not exist b2.exe exit /b 1
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          b2.exe --version
          b2.exe toolset=msvc address-model=64 variant=release link=static,shared threading=multi --with-system --with-filesystem --with-regex --with-thread --with-chrono --with-date_time --with-program_options -j2 stage > build.log 2>&1
          set RESULT=%ERRORLEVEL%
          type build.log
          dir /s /b stage\lib
          if not "%RESULT%"=="0" exit /b %RESULT%
          cl /nologo /EHsc /MD /std:c++14 /DBOOST_ALL_NO_LIB /I. ..\smoke.cpp /Fe:smoke14-static.exe /link /LIBPATH:stage\lib libboost_filesystem-vc-mt-1_53.lib libboost_regex-vc-mt-1_53.lib libboost_system-vc-mt-1_53.lib ws2_32.lib mswsock.lib
          if errorlevel 1 exit /b 1
          smoke14-static.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /MD /std:c++14 /DBOOST_ALL_NO_LIB /DBOOST_ALL_DYN_LINK /I. ..\smoke.cpp /Fe:smoke14-shared.exe /link /LIBPATH:stage\lib boost_filesystem-vc-mt-1_53.lib boost_regex-vc-mt-1_53.lib boost_system-vc-mt-1_53.lib ws2_32.lib mswsock.lib
          if errorlevel 1 exit /b 1
          set PATH=%CD%\stage\lib;%PATH%
          smoke14-shared.exe
          if errorlevel 1 exit /b 1

          cl /nologo /EHsc /MD /std:c++17 /D_HAS_AUTO_PTR_ETC=1 /DBOOST_ALL_NO_LIB /I. ..\smoke.cpp /Fe:smoke-static.exe /link /LIBPATH:stage\lib libboost_filesystem-vc-mt-1_53.lib libboost_regex-vc-mt-1_53.lib libboost_system-vc-mt-1_53.lib ws2_32.lib mswsock.lib
          if errorlevel 1 exit /b 1
          smoke-static.exe
          if errorlevel 1 exit /b 1
          cl /nologo /EHsc /MD /std:c++17 /D_HAS_AUTO_PTR_ETC=1 /DBOOST_ALL_NO_LIB /DBOOST_ALL_DYN_LINK /I. ..\smoke.cpp /Fe:smoke-shared.exe /link /LIBPATH:stage\lib boost_filesystem-vc-mt-1_53.lib boost_regex-vc-mt-1_53.lib boost_system-vc-mt-1_53.lib ws2_32.lib mswsock.lib
          if errorlevel 1 exit /b 1
          set PATH=%CD%\stage\lib;%PATH%
          smoke-shared.exe
          if errorlevel 1 exit /b 1
          exit /b 0
